<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Apple / FINOLABS standard squircle -->
    <clipPath id="squircle-clip-dark">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>

    <!-- FINOLABS Iridescent Gradient for Dark Mode Strokes & Nodes -->
    <linearGradient id="fn-iridescent-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FE2CE" />
      <stop offset="35%" stop-color="#87D3E1" />
      <stop offset="70%" stop-color="#C9A8E5" />
      <stop offset="100%" stop-color="#9750C4" />
    </linearGradient>

    <!-- Subtle surface glow for dark backdrop -->
    <radialGradient id="fn-dark-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#19192B" />
      <stop offset="100%" stop-color="#0B0B17" />
    </radialGradient>

    <!-- High-clarity drop shadow for stroke elevation -->
    <filter id="mint-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7FE2CE" flood-opacity="0.25" />
    </filter>
  </defs>

  <g clip-path="url(#squircle-clip-dark)">
    <!-- Surface: FINOLABS Deep Lab Ink -->
    <rect width="512" height="512" fill="url(#fn-dark-glow)" />

    <!-- Foreground: Architectural Mindmap with Iridescent Stroke -->
    <g filter="url(#mint-glow)">
      <!-- Branches (Strokes) -->
      <g fill="none" stroke="url(#fn-iridescent-dark)" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main Branch 1 (Top) -->
        <path d="M 135 256 C 210 256, 220 156, 305 156 L 320 156" stroke-width="18" />
        <path d="M 320 156 C 355 156, 365 112, 390 112 L 415 112" stroke-width="12" />
        <path d="M 320 156 C 355 156, 365 184, 390 184 L 415 184" stroke-width="12" />

        <!-- Main Branch 2 (Middle) -->
        <path d="M 135 256 L 335 256" stroke-width="18" />
        <path d="M 335 256 L 415 256" stroke-width="12" />

        <!-- Main Branch 3 (Bottom) -->
        <path d="M 135 256 C 210 256, 220 356, 305 356 L 320 356" stroke-width="18" />
        <path d="M 320 356 C 355 356, 365 328, 390 328 L 415 328" stroke-width="12" />
        <path d="M 320 356 C 355 356, 365 400, 390 400 L 415 400" stroke-width="12" />
      </g>

      <!-- Nodes -->
      <!-- Root Node (Major Hub) -->
      <circle cx="135" cy="256" r="28" fill="#7FE2CE" />
      <circle cx="135" cy="256" r="11" fill="#0B0B17" />

      <!-- Level 1 Nodes (Junctions) -->
      <circle cx="320" cy="156" r="18" fill="#87D3E1" />
      <circle cx="320" cy="156" r="7.5" fill="#0B0B17" />

      <circle cx="335" cy="256" r="18" fill="#A7B5EC" />
      <circle cx="335" cy="256" r="7.5" fill="#0B0B17" />

      <circle cx="320" cy="356" r="18" fill="#C9A8E5" />
      <circle cx="320" cy="356" r="7.5" fill="#0B0B17" />

      <!-- Level 2 Leaf Terminals (Solid Dots) -->
      <circle cx="415" cy="112" r="11" fill="#87D3E1" />
      <circle cx="415" cy="184" r="11" fill="#87D3E1" />
      <circle cx="415" cy="256" r="11" fill="#A7B5EC" />
      <circle cx="415" cy="328" r="11" fill="#C9A8E5" />
      <circle cx="415" cy="400" r="11" fill="#C9A8E5" />
    </g>
  </g>
</svg>
