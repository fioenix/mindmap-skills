name: CI & Marketplace Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Manifests & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for tracked ignored files
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [[ -n "$tracked_ignored" ]]; then
            echo "❌ Error: Tracked files match .gitignore rules:"
            echo "$tracked_ignored"
            exit 1
          fi
          echo "✓ Zero tracked ignored files"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.287 # bump manually; Dependabot does not track this

      - name: Run Marketplace Readiness Test Suite
        run: bash tests/validate.sh
