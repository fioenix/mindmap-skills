name: CI & Marketplace Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Manifests & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for tracked ignored files
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [[ -n "$tracked_ignored" ]]; then
            echo "❌ Error: Tracked files match .gitignore rules:"
            echo "$tracked_ignored"
            exit 1
          fi
          echo "✓ Zero tracked ignored files"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Run Marketplace Readiness Test Suite
        run: bash tests/validate.sh
