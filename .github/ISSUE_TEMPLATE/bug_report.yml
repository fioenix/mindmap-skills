name: 🐛 Bug Report
description: Report a bug, rendering issue, or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please ensure you have anonymized any private or proprietary information before submitting.
  - type: dropdown
    id: agent_host
    attributes:
      label: AI Agent Platform
      description: Which agent client or runtime did you use?
      options:
        - Claude Code CLI
        - Claude Desktop / Web UI
        - OpenAI Codex / Agents SDK
        - Google Antigravity
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: input_prompt
    attributes:
      label: Input Prompt / Content (Anonymized)
      description: Provide the prompt or markdown text that produced the error.
      placeholder: "E.g. /mindmap-skills:markmap create mindmap for..."
    validations:
      required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I confirm this issue report contains NO proprietary code, customer PII, secrets, or sensitive credentials.
          required: true
